[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Coverage options
# Coverage is configured via .coveragerc file
# Add modules to .coveragerc 'include' list as you add tests for them
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
# --cov-fail-under=75 is intentionally NOT set here: it would apply to every
# pytest invocation, including the Test Stage's partial runs (e.g. just
# test_ride_utils.py), which can never reach full-suite coverage on their
# own. The dedicated Coverage Stage in ci.yml passes it explicitly against
# the full test suite instead.

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    system: System tests
    slow: Tests that take a long time to run

