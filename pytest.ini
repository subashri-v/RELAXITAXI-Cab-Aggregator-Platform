[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
# Coverage is configured via .coveragerc file
# Add modules to .coveragerc 'include' list as you add tests for them
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=75

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    system: System tests
    slow: Tests that take a long time to run

